name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
          - os: macos-latest
            target: darwin-x64
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-latest
            target: linux-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Build for ${{ matrix.target }}
        run: bun run build.ts --target=${{ matrix.target }}

      - name: Zip macOS .app bundle
        if: startsWith(matrix.target, 'darwin-')
        run: |
          cd dist
          mv "Markdown to PDF-macos.app" "markdown-to-pdf-macos-${{ matrix.target == 'darwin-arm64' && 'arm64' || 'x64' }}.app"
          zip -r "markdown-to-pdf-macos-${{ matrix.target == 'darwin-arm64' && 'arm64' || 'x64' }}.zip" "markdown-to-pdf-macos-${{ matrix.target == 'darwin-arm64' && 'arm64' || 'x64' }}.app"

      - name: Zip Windows binary
        if: matrix.target == 'windows-x64'
        shell: bash
        run: |
          cd dist
          7z a "markdown-to-pdf-${{ matrix.target }}.zip" "markdown-to-pdf-${{ matrix.target }}.exe"

      - name: Zip Linux binary
        if: startsWith(matrix.target, 'linux-')
        run: |
          cd dist
          zip "markdown-to-pdf-${{ matrix.target }}.zip" "markdown-to-pdf-${{ matrix.target }}" "markdown-to-pdf-${{ matrix.target }}.desktop"

      - name: Upload binary
        if: ${{ !startsWith(matrix.target, 'darwin-') }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}
          path: dist/markdown-to-pdf-${{ matrix.target }}.zip

      - name: Upload macOS .app bundle
        if: startsWith(matrix.target, 'darwin-')
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}-app
          path: dist/markdown-to-pdf-macos-${{ matrix.target == 'darwin-arm64' && 'arm64' || 'x64' }}.zip



  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != github.event.repository.default_branch && github.ref_name || format('v-draft-{0}', github.run_id) }}
          draft: true
          generate_release_notes: true
          files: |
            artifacts/*
