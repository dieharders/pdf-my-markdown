name: Release

on:
  workflow_dispatch:
  # push:
  #   tags:
  #     - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
          - os: macos-latest
            target: darwin-x64
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-latest
            target: linux-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Build for ${{ matrix.target }}
        run: bun run build.ts --target=${{ matrix.target }}

      - name: Zip macOS .app bundle
        if: startsWith(matrix.target, 'darwin-')
        run: |
          cd dist
          mv "Markdown to PDF-macos.app" "Markdown to PDF-macos-${{ matrix.target }}.app"
          zip -r "markdown-to-pdf-${{ matrix.target }}-app.zip" "Markdown to PDF-macos-${{ matrix.target }}.app"

      - name: Upload binary
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.target }}
          path: dist/markdown-to-pdf-${{ matrix.target }}${{ matrix.target == 'windows-x64' && '.exe' || '' }}

      - name: Upload macOS .app bundle
        if: startsWith(matrix.target, 'darwin-')
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.target }}-app
          path: dist/markdown-to-pdf-${{ matrix.target }}-app.zip

      - name: Upload Linux .desktop file
        if: startsWith(matrix.target, 'linux-')
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.target }}-desktop
          path: dist/markdown-to-pdf-${{ matrix.target }}.desktop

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*
